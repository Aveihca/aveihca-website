

<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#080808">

  <title>AVEIHCA | Business Solutions</title>

  <style>

    * { box-sizing: border-box; }

    body {

      margin: 0;

      background: #080808;

      color: #f5f0e6;

      font-family: Arial, sans-serif;

    }

    header {

      padding: 24px;

      border-bottom: 1px solid #7a612e;

      text-align: center;

    }

    .logo {

      color: #d9b76c;

      font-size: 28px;

      font-weight: bold;

      letter-spacing: 5px;

    }

    main {

      min-height: 75vh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 40px 24px;

      text-align: center;

    }

    h1 {

      font-size: clamp(36px, 8vw, 72px);

      line-height: 1.1;

      margin: 0 0 24px;

    }

    p { color: #c6bca9; line-height: 1.7; }

    .accent { color: #d9b76c; }

    .button {

      display: inline-block;

      margin-top: 28px;

      padding: 16px 30px;

      border: 1px solid #d9b76c;

      color: #d9b76c;

      text-decoration: none;

      border-radius: 4px;

    }

    footer {

      text-align: center;

      padding: 24px;

      border-top: 1px solid #302919;

      font-size: 13px;

    }

  </style>

</head>

<body>

  <header>

    <div class="logo">AVEIHCA</div>

  </header>

  <main>

    <section>

      <p class="accent">BUSINESS SOLUTIONS</p>

      <h1>We Build What Makes<br>

        <span class="accent">Business Better.</span>

      </h1>

      <p>Building smarter solutions for a stronger future.</p>

      <a class="button" href="mailto:contact@example.com">

        Contact Us

      </a>

    </section>

  </main>

  <footer>

    &copy; 2026 AVEIHCA. All rights reserved.

  </footer>

</html>
